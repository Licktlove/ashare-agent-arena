<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A 股 Agent 沙盘</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div><small>模拟交易研究</small><h1>Agent 沙盘</h1><p>观察每个账户的委托、持仓和操作记录</p></div><span class="status">本地测试 · 手动报价</span></header>
<main>
<section class="notice"><strong>开发中</strong> 当前报价由用户手动输入，自动行情和模型决策尚未接入。测试成交不代表真实市场成交。</section>
<section><div class="heading"><div><small>ACCOUNTS</small><h2>模拟账户</h2></div><button id="refresh">刷新数据</button></div><div id="accounts" class="cards"></div></section>
<div class="columns"><section><small>CREATE</small><h2>创建 Agent</h2><form id="agent"><label>名称<input name="name" required placeholder="例如 松"></label><label>初始本金（元）<input name="cash" type="number" min="1" value="100000" required></label><label>模型名称<input name="model" placeholder="例如 deepseek-chat"></label><label>模型接口地址<input name="endpoint" type="url" placeholder="https://api.deepseek.com"></label><label>随机种子<input name="seed" type="number" min="0" value="1"></label><button class="primary">创建账户</button></form></section>
<section><small>ORDERS</small><h2>测试限价委托</h2><form id="order"><label>账户<select name="agentId" required></select></label><label>股票代码<input name="symbol" placeholder="SH600000" required></label><label>方向<select name="side"><option value="buy">买入</option><option value="sell">卖出</option></select></label><label>数量（股）<input name="quantity" type="number" min="1" step="1" value="100" required></label><label>限价（元）<input name="limitPrice" type="number" min="0.01" step="0.01" required></label><button class="primary">提交模拟委托</button></form></section>
<section><small>MARKET INPUT</small><h2>输入测试报价</h2><form id="quote"><label>股票代码<input name="symbol" placeholder="SH600000" required></label><label>买一价格（元）<input name="bid" type="number" min="0.01" step="0.01" required></label><label>卖一价格（元）<input name="ask" type="number" min="0.01" step="0.01" required></label><label>买一数量（股）<input name="bidQuantity" type="number" min="0" value="100" required></label><label>卖一数量（股）<input name="askQuantity" type="number" min="0" value="100" required></label><button class="primary">发布测试报价</button></form></section></div>
<section><div class="heading"><div><small>EXECUTION</small><h2>委托与持仓</h2></div></div><div id="orders"></div><div id="positions"></div></section>
<section><div class="heading"><div><small>ACTIVITY</small><h2>操作日志</h2></div></div><div id="events"></div></section>
<p id="message" role="status"></p>
</main><script type="module" src="/app.js"></script></body></html>
